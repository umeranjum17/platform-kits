name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  TMPDIR: /tmp

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: node scripts/readme-check.ts
      - run: npm test # throwaway HOME, mocks only: no account, no network, no model
      - run: npm run smoke:pack
      - name: Release lint (PR)
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: origin/${{ github.base_ref }}
        run: npm run release -- lint --base "$RELEASE_BASE"
      - name: Release lint (main push)
        if: github.event_name == 'push'
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: npm run release -- lint --base "$RELEASE_BASE" --direct
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser unit tests and real isolated Chromium
        run: |
          PLATFORM_KITS_CHROME="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          export PLATFORM_KITS_CHROME
          npm run test:browser
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac

  record-recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: sh scripts/test.sh packages/record/test/real/smoke.test.ts
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac

  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/expo/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: npm run typecheck
        working-directory: examples/expo
      - run: npx expo export --platform android --platform ios --output-dir dist
        working-directory: examples/expo
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac

  overlay-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Release bundling resolves the linked kit exports and their dependencies from the repo root.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleRelease :platform-kits-overlay:testDebugUnitTest)
        working-directory: examples/expo
        env:
          EXPO_PUBLIC_SCREEN_DEMO: '1'
          NODE_ENV: production
      - run: |
          sudo chmod 666 /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: cd examples/expo/android && ./gradlew :platform-kits-overlay:connectedDebugAndroidTest :a11y-demo:connectedDebugAndroidTest -PreactNativeArchitectures=x86_64 && cd .. && ./e2e-screen-frame.sh emulator-5554 .screen-captures
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byokit-screen-proof
          path: examples/expo/.screen-captures/*.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overlay-webview-test-reports
          path: examples/expo/modules/a11y-demo/android/build/outputs/androidTest-results/
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac

  statusbar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Allocate private scratch
        run: echo "TMPDIR=$(mktemp -d /tmp/bk-XXXX)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/expo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: npm ci --no-audit --no-fund
      - name: Packed plugin on Expo 55
        run: node scripts/statusbar-expo-smoke.ts
      - run: npm ci --no-audit --no-fund
        working-directory: examples/expo
      - run: CI=1 npx expo prebuild -p android --no-install && (cd android && ./gradlew assembleDebug :platform-kits-statusbar:testDebugUnitTest)
        working-directory: examples/expo
      - name: Clean private scratch
        if: always()
        run: case "$TMPDIR" in /tmp/bk-????) rm -rf -- "$TMPDIR";; esac
